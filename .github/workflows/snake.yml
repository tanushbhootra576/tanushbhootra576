name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write   # ✅ REQUIRED

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game
        uses: Platane/snk@v3
        with:
          github_user_name: tanushbhootra576
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#F59E0B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F59E0B

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
