<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
  <defs>
    <style>
      @keyframes fade {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .n { animation: fade 1.2s ease both; }
      .r { animation: fade 1.2s ease both; animation-delay: 0.3s; }
      .s { animation: fade 1.2s ease both; animation-delay: 0.6s; }
    </style>
  </defs>

  <rect width="900" height="150" fill="#000000"/>

  <text class="n"
    x="450" y="80"
    font-family="Georgia, serif"
    font-size="52" font-weight="400"
    fill="#e8e0d5" text-anchor="middle"
    letter-spacing="8" opacity="0">TANUSH BHOOTRA</text>

  <rect class="r"
    x="350" y="95"
    width="200" height="1"
    fill="#F59E0B" opacity="0"/>

  <text class="s"
    x="450" y="120"
    font-family="'Courier New', Courier, monospace"
    font-size="11" fill="#F59E0B" text-anchor="middle"
    letter-spacing="5" opacity="0">CODER  ·  DEVELOPER  ·  EDITOR</text>
</svg>
